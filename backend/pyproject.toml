[project]
name = "sourceatlas"
version = "0.1.0"
description = "SourceAtlas API: agentic RAG with verified citations."
authors = [
    { name = "Sreevarshann", email = "85571922+Sreevarshann@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "langgraph>=1.2.20",
    "lxml>=6.1.3",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"src/sourceatlas/migrations/**" = ["I", "UP", "RUF", "F401"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["sourceatlas"]
exclude = ["migrations/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "fitz", "fitz.*", "pymupdf", "docx", "docx.*", "trafilatura", "trafilatura.*", "rank_bm25", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore:builtin type swig:DeprecationWarning"]
markers = ["live: requires local Ollama models (excluded from CI)"]
