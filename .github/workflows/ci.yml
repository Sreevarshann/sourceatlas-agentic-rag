name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests on pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sourceatlas
          POSTGRES_PASSWORD: sourceatlas_ci_only
          POSTGRES_DB: sourceatlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sourceatlas" --health-interval 3s --health-retries 20
    env:
      SOURCEATLAS_TEST_ADMIN_URL: postgresql+psycopg://sourceatlas:sourceatlas_ci_only@127.0.0.1:5432/sourceatlas
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Tests (hashing embedder + fixture LLM; real Postgres)
        run: uv run pytest -m "not live" -q
      - name: Dependency audit
        shell: bash
        run: uvx pip-audit --strict -r <(uv export --frozen --no-dev --no-hashes --no-emit-project)

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
